name: Deploy MDWAPI

on:
  push:
    branches:
      - main
    paths:
      - "src/MDWAPI/**"
      - ".github/workflows/deploy-mdwapi.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mdwapi
  cancel-in-progress: true

env:
  PROJECT_PATH: src/MDWAPI/MDWAPI.csproj
  PUBLISH_DIR: ${{ github.workspace }}/artifacts/mdwapi-publish
  DEPLOY_DIR: /opt/mdwapi
  SERVICE_NAME: mdwapi
  APP_URLS: http://0.0.0.0:7192

jobs:
  deploy:
    name: Build and deploy MDWAPI
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .NET
        run: dotnet --info

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" --configuration Release --no-restore --output "$PUBLISH_DIR"

      - name: Prepare deploy directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"

      - name: Deploy published files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude appsettings.Production.json \
            "$PUBLISH_DIR"/ "$DEPLOY_DIR"/

      - name: Restart service
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl restart "$SERVICE_NAME"
          sudo -n systemctl status "$SERVICE_NAME" --no-pager

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:7192/health"; then
              exit 0
            fi
            sleep 3
          done

          sudo -n journalctl -u "$SERVICE_NAME" -n 100 --no-pager
          exit 1
